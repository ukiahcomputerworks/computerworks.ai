<div class="logo-banner">

  </a>
</div>
<header class="site-header">
  <div class="site-header-inner">
    <span class="brand-slogan-text">{{ site.slogan }}</span>
    <a class="header-phone" href="tel:7074628275">(707) 462-8275</a>
  </div>
  <nav class="site-nav">
    <div class="nav-wrap">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav-inner" onclick="var n=document.getElementById('nav-inner');var open=n.classList.toggle('is-open');this.setAttribute('aria-expanded',open);">Menu ▾</button>
      <div class="nav-inner" id="nav-inner">
        <a class="nav-link" href="{{ site.baseurl }}/">Home</a>
        <a class="nav-link" href="{{ site.baseurl }}/business-it-infrastructure/">Infrastructure</a>
        <a class="nav-link" href="{{ site.baseurl }}/clientele/">Clientele</a>
        <a class="nav-link" href="{{ site.baseurl }}/automation/">Automation</a>
        <a class="nav-link" href="{{ site.baseurl }}/48hr-web-rescue/">48-Hour Rescue</a>
        <a class="nav-link" href="{{ site.baseurl }}/certifications/">Certifications</a>
        <a class="nav-link" href="{{ site.baseurl }}/contact/">Contact Us</a>
      </div>
    </div>
  </nav>
</header>
<script>
  (function () {
    function normalizePath(path) {
      var normalized = path.replace(/index\.html$/, '');
      return normalized.endsWith('/') ? normalized : normalized + '/';
    }

    var currentPath = normalizePath(window.location.pathname);
    document.querySelectorAll('.nav-link').forEach(function (link) {
      var linkPath = normalizePath(new URL(link.href, window.location.origin).pathname);
      var active = linkPath === currentPath;
      link.classList.toggle('is-active', active);
      if (active) {
        link.setAttribute('aria-current', 'page');
      } else {
        link.removeAttribute('aria-current');
      }
    });
  }());
</script>
